<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미드랜드 검토·추가발주 미리보기</title><link rel="stylesheet" href="../staff/style.css"><link rel="stylesheet" href="../staff/order-review.css"><style>body{display:block}main{margin:0 auto;padding:24px;max-width:1000px}.demo-role{display:flex;gap:10px}.notice{padding:14px;background:#fff1df;border-radius:12px}.line{gap:12px}#demoSubmit{margin:16px 0}</style></head><body><main><h1>미드랜드 검토·추가발주 미리보기</h1><p class="notice">예시 자료입니다. 실제 계정·발주·재고는 변경되지 않습니다.</p><div class="demo-role"><button id="staffRole">직원 화면</button><button id="managerRole">관리자 화면</button></div><div id="reviewStatus"></div><button class="primary" id="demoSubmit"></button><h2>같은 입고희망일의 발주 합계</h2><div id="history"></div></main><script type="module">
import {canFinalizeMidland,midlandReviewStatus,renderGroupedOrderHistory} from '../staff/order-review.mjs';
import {tomorrowToronto} from '../staff/core.mjs';
const t=(ko,en)=>ko,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=tomorrowToronto();let profile={role:'employee',active:true};
const catalog=[{id:'milk',name_ko:'우유',name_en:'Milk',category:'원재료·음료',subgroup:'유제품',order_unit:'EA',unit_confirmed:true,active:true},{id:'oat',name_ko:'오트 밀크',name_en:'Oat Milk',category:'원재료·음료',subgroup:'유제품',order_unit:'EA',unit_confirmed:true,active:true}];
let orders=[{id:'demo-first',store_id:'midland',source_kind:'store',delivery_date:date,status:'submitted',order_revision:1,note:'첫 발주',kream_order_items:[{product_id:'milk',name_ko:'우유',name_en:'Milk',order_unit:'EA',quantity:2}]},{id:'demo-addition',store_id:'midland',source_kind:'store',delivery_date:date,status:'submitted',order_revision:1,note:'놓친 품목 추가 발주',kream_order_items:[{product_id:'milk',name_ko:'우유',name_en:'Milk',order_unit:'EA',quantity:3},{product_id:'oat',name_ko:'오트 밀크',name_en:'Oat Milk',order_unit:'EA',quantity:1}]}];
function draw(){const c={t,esc,name:p=>p.name_ko,orders,catalog,stores:[{id:'midland',name:'Midland · Scarborough'}],profile,preview:false,lang:'ko',orderReference:id=>id==='demo-first'?'KR-DEMO0001':'KR-DEMO0002',dispatches:[],receipts:[],act:async fn=>fn(),say:message=>{document.querySelector('.notice').textContent='미리보기: '+message;},reload:async()=>draw(),db:{rpc:async(fn,args)=>{if(fn!=='kream_revise_midland_order')return {error:Error('Preview only')};const o=orders.find(o=>o.id===args.target_order);o.kream_order_items=args.new_items.map(i=>({...catalog.find(p=>p.id===i.product_id),...i}));o.note=args.new_note;o.delivery_date=args.new_date;o.order_revision++;o.amended_at=new Date().toISOString();return {data:o};}}};
document.querySelector('#reviewStatus').innerHTML=midlandReviewStatus({review_requested_at:new Date().toISOString(),review_changed_since_request:false},{t,esc});
document.querySelector('#demoSubmit').textContent=canFinalizeMidland(profile)?'최종 발주':'관리자 검토 요청';
renderGroupedOrderHistory(document.querySelector('#history'),c);
}
document.querySelector('#staffRole').onclick=()=>{profile={role:'employee',active:true};draw();};document.querySelector('#managerRole').onclick=()=>{profile={role:'midland_owner',active:true};draw();};document.querySelector('#demoSubmit').onclick=()=>alert('디자인 미리보기입니다. 실제 전송은 하지 않습니다.');draw();
</script></body></html>
